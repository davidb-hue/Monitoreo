# =====================================================================
#  Pizarra de Monitoreo – stack local completo con Docker
#    db  = PostgreSQL (reemplaza a Neon; los datos quedan en tu equipo)
#    app = servidor Express que sirve el frontend Vue
#
#  Uso rápido:
#    1) copia .env.example a .env y pon un PEPPER
#    2) docker compose up -d --build
#    3) abre http://localhost:3000
#    4) asigna los PIN (ver DOCKER.md)
# =====================================================================
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pizarra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pizarra_local}
      POSTGRES_DB: pizarra
    volumes:
      - pgdata:/var/lib/postgresql/data
      # El esquema se crea solo la PRIMERA vez (cuando el volumen está vacío)
      - ./apps/server/db/neon.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizarra -d pizarra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://pizarra:${DB_PASSWORD:-pizarra_local}@db:5432/pizarra
      PEPPER: ${PEPPER:?Falta PEPPER. Copia .env.example a .env y define un PEPPER.}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
