<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e3a8c">
  <link rel="icon" href="/img/yes.png">
  <title>Pizarra de Monitoreo – Lactolac</title>
  <script>
    // Fija el tema antes de pintar para evitar parpadeo claro→oscuro.
    try {
      var t = localStorage.getItem('pizarraTema') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
